<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CARLOS MESSENGER</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:#0b141a;color:#fff}header{background:#008069;padding:14px;display:flex;justify-content:space-between;align-items:center}.logo{width:38px;height:38px;background:#fff;color:#008069;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:900}.tabs{display:flex;background:#008069}.tabs button{flex:1;padding:12px;background:none;border:none;color:#fff;font-weight:700}.tabs button.active{background:#00695c}main{padding:12px;padding-bottom:80px}.card{background:#111b21;padding:12px;border-radius:12px;margin-bottom:10px}input{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:none;background:#202c33;color:#fff}button.btn{width:100%;padding:12px;background:#00a884;border:none;border-radius:10px;color:#fff;font-weight:800}.bubble{background:#005c4b;padding:10px;border-radius:12px;margin:6px 0;max-width:85%}.bubble.me{margin-left:auto;background:#00a884}</style></head>
<body><header><div class="logo">C</div><b>CARLOS MESSENGER</b><span>● Online</span></header>
<div class="tabs"><button onclick="show('chats',this)" class="active">Chats</button><button onclick="show('updates',this)">Updates</button><button onclick="show('communities',this)">Communities</button><button onclick="show('calls',this)">Calls</button><button onclick="show('settings',this)">Settings</button></div>
<main>
<div id="chats"><div class="card"><h3>Login / Register</h3><input id="login" placeholder="Phone / Email / Username"><input id="pass" type="password" placeholder="Password"><button class="btn" onclick="login()">Login</button><input id="phone" placeholder="Phone e.g +234..."><button class="btn" onclick="sendOtp()">Send OTP via Termii</button><input id="otp" placeholder="OTP Code"><input id="regName" placeholder="Full Name"><input id="regUser" placeholder="Username"><button class="btn" onclick="register()">Create Account</button></div><div class="card"><h3>New Chat</h3><input id="chatName" placeholder="Chat name / Group name"><button class="btn" onclick="createChat()">Create Chat / Group</button><div id="chatList"></div></div><div class="card"><h3>Messages</h3><div id="msgs"></div><input id="msgText" placeholder="Type message..."><button class="btn" onclick="sendMsg()">Send ➤</button></div></div>
<div id="updates" style="display:none"><div class="card"><h3>Status - 24h</h3><input id="statusText" placeholder="Text status..."><button class="btn" onclick="postStatus()">Post Status</button><div id="statusList"></div></div></div>
<div id="communities" style="display:none"><div class="card"><h3>Communities</h3><button class="btn" onclick="createChat()">Create Community</button></div></div>
<div id="calls" style="display:none"><div class="card"><h3>Voice & Video Calls</h3><button class="btn" onclick="startCall('voice')">🎙️ Voice Call</button><br><br><button class="btn" onclick="startCall('video')">📹 Video Call</button><video id="localVideo" autoplay muted style="width:100%"></video><div id="callLog"></div></div></div>
<div id="settings" style="display:none"><div class="card"><h3>Settings</h3><input id="setName" placeholder="Name"><input id="setBio" placeholder="Bio"><button class="btn" onclick="saveProfile()">Save Profile</button><button class="btn" onclick="toggleTheme()">Toggle Dark / Light</button><button class="btn" onclick="admin()">Admin Dashboard</button><div id="adminBox"></div></div></div>
</main>
<script src="/socket.io/socket.io.js"></script><script>
let token=localStorage.getItem('carlos_token'),user=null,socket=io(),currentChat=null;
function show(id,el){['chats','updates','communities','calls','settings'].forEach(x=>document.getElementById(x).style.display=x==id?'block':'none');document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('active'));el.classList.add('active')}
async function api(p,m,b){let r=await fetch(p,{method:m,headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:b?JSON.stringify(b):undefined});return r.json()}
async function sendOtp(){alert(JSON.stringify(await api('/api/send-otp','POST',{phone:document.getElementById('phone').value})))}
async function register(){let r=await api('/api/register','POST',{phone:document.getElementById('phone').value,email:document.getElementById('phone').value+'@carlos.app',username:document.getElementById('regUser').value,password:document.getElementById('pass').value,name:document.getElementById('regName').value});if(r.token){token=r.token;localStorage.setItem('carlos_token',token);alert('Account created! ID: '+r.user.id)}else alert(r.error)}
async function login(){let r=await api('/api/login','POST',{login:document.getElementById('login').value,password:document.getElementById('pass').value});if(r.token){token=r.token;localStorage.setItem('carlos_token',token);user=r.user;socket.emit('join-user',user.id);alert('Welcome '+user.name);loadChats()}else alert(r.error)}
async function createChat(){let r=await api('/api/chats','POST',{type:'group',name:document.getElementById('chatName').value});currentChat=r.id;socket.emit('join',currentChat);alert('Chat created: '+r.id);loadChats()}
async function loadChats(){let chats=await api('/api/chats','GET');document.getElementById('chatList').innerHTML=(chats||[]).map(c=>`<div class="bubble" onclick="openChat('${c.id}')">${c.name||c.id} - Tap to open</div>`).join('')}
async function openChat(id){currentChat=id;socket.emit('join',id);let ms=await api('/api/messages/'+id,'GET');document.getElementById('msgs').innerHTML=ms.map(m=>`<div class="bubble ${m.senderId==user?.id?'me':''}">${m.text} <span>✓✓ ${new Date(m.createdAt).toLocaleTimeString()}</span></div>`).join('')}
async function sendMsg(){let t=document.getElementById('msgText').value;if(!currentChat)return alert('Open a chat first');await api('/api/messages','POST',{chatId:currentChat,text:t});document.getElementById('msgText').value=''}
async function postStatus(){await api('/api/status','POST',{text:document.getElementById('statusText').value});alert('Status posted, disappears in 24h')}
async function saveProfile(){await api('/api/profile','POST',{name:document.getElementById('setName').value,bio:document.getElementById('setBio').value});alert('Profile saved')}
function toggleTheme(){document.body.style.background=document.body.style.background=='white'?'#0b141a':'white';document.body.style.color=document.body.style.color=='black'?'#fff':'black'}
async function admin(){let s=await api('/api/admin/stats','GET');document.getElementById('adminBox').innerHTML=`<p>Users: ${s.users} | Messages: ${s.messages}</p>`}
async function startCall(type){alert(type+' call ringing... Allow mic/camera');try{let s=await navigator.mediaDevices.getUserMedia({audio:true,video:type=='video'});document.getElementById('localVideo').srcObject=s}catch(e){alert('Allow mic/camera')}}
socket.on('new-message',m=>{if(m.chatId==currentChat)openChat(currentChat)});
socket.on('incoming-call',d=>{if(confirm('Incoming call from '+d.callerId+' Accept?'))alert('Call connected')});
</script></body></html>
